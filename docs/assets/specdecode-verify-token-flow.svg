<rect x="30" y="465" width="151" height="75" rx="11" fill="#e0f4ed" stroke="#cbd9e2"/>
<text x="105.5" y="495" fill="#0e6b59" font-size="28" font-weight="700" text-anchor="middle">c₁</text>
<text x="105.5" y="522" fill="#344e61" font-size="22" font-weight="400" text-anchor="middle">接受</text>
<rect x="199" y="465" width="151" height="75" rx="11" fill="#e0f4ed" stroke="#cbd9e2"/>
<text x="274.5" y="495" fill="#0e6b59" font-size="28" font-weight="700" text-anchor="middle">c₂</text>
<text x="274.5" y="522" fill="#344e61" font-size="22" font-weight="400" text-anchor="middle">接受</text>
<rect x="368" y="465" width="151" height="75" rx="11" fill="#fff0dc" stroke="#cbd9e2"/>
<text x="443.5" y="495" fill="#964b10" font-size="28" font-weight="700" text-anchor="middle">c₃</text>
<text x="443.5" y="522" fill="#344e61" font-size="22" font-weight="400" text-anchor="middle">首次拒绝</text>
<rect x="537" y="465" width="151" height="75" rx="11" fill="#eff4f7" stroke="#cbd9e2"/>
<text x="612.5" y="495" fill="#344e61" font-size="28" font-weight="700" text-anchor="middle">c₄</text>
<text x="612.5" y="522" fill="#344e61" font-size="22" font-weight="400" text-anchor="middle">作废</text>
<path d="M105 540 V559 H360 V578" fill="none" stroke="#0e6b59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  />
<path d="M274 540 V559" fill="none" stroke="#0e6b59" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  />
<path d="M443 540 V559 H360 V580" fill="none" stroke="#964b10" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr-a)"/>
<rect x="80" y="586" width="560" height="65" rx="11" fill="#e0f4ed" stroke="#cbd9e2"/>
<text x="360.0" y="616" fill="#0e6b59" font-size="28" font-weight="700" text-anchor="middle">提交 c₁、c₂ 和目标修正 token</text>
<text x="360.0" y="643" fill="#344e61" font-size="22" font-weight="400" text-anchor="middle">A=2，τ=3；拒绝后的草稿状态不提交</text>
<rect x="28" y="688" width="664" height="48" rx="10" fill="#e8f1ff" stroke="none"/>
<text x="45" y="720" fill="#235598" font-size="22" font-weight="700" text-anchor="start">若四位都通过，则目标另补一位；EOS 等停点另计</text>
</g>
</svg>
