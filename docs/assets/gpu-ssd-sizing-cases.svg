<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="t d"><title id="t">Three SSD sizing examples</title><desc id="d">Checkpoint is limited by write endurance as well as throughput; KV by read IOPS and capacity; online hot weights by bandwidth.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5L0 10z" fill="#526980"/></marker></defs><rect x="0" y="0" width="960" height="530" rx="12" fill="#f7faff" stroke="none"/><g font-family="system-ui, sans-serif"><text x="36" y="54" font-size="34" fill="#142a46" font-weight="750" text-anchor="start">Three SSD budgets, three different gates</text><text x="36" y="89" font-size="20" fill="#526980" font-weight="500" text-anchor="start">Planning examples  ·  not benchmark results</text><rect x="36" y="121" width="888" height="104" rx="12" fill="white" stroke="#cadbea"/><text x="57" y="154" font-size="22" fill="#146d9c" font-weight="750" text-anchor="start">Checkpoint</text><text x="57" y="184" font-size="17" fill="#526980" font-weight="500" text-anchor="start">60 TB every 5 minutes</text><text x="405" y="159" font-size="29" fill="#146d9c" font-weight="750" text-anchor="start">200 GB/s</text><text x="405" y="190" font-size="17" fill="#526980" font-weight="500" text-anchor="start">shared sustained write; 4.39 DWPD locally</text><rect x="36" y="239" width="888" height="104" rx="12" fill="white" stroke="#cadbea"/><text x="57" y="272" font-size="22" fill="#25755f" font-weight="750" text-anchor="start">KV reuse</text><text x="57" y="302" font-size="17" fill="#526980" font-weight="500" text-anchor="start">100 SSD hits/s, 128 Ki-token</text><text x="405" y="277" font-size="29" fill="#25755f" font-weight="750" text-anchor="start">15.17 GB/s</text><text x="405" y="308" font-size="17" fill="#526980" font-weight="500" text-anchor="start">read; 116k IOPS at 128 KiB; 283.5 TB raw</text><rect x="36" y="357" width="888" height="104" rx="12" fill="white" stroke="#cadbea"/><text x="57" y="390" font-size="22" fill="#946012" font-weight="750" text-anchor="start">Hot weights</text><text x="57" y="420" font-size="17" fill="#526980" font-weight="500" text-anchor="start">70B BF16, 76 GB streamed/step</text><text x="405" y="395" font-size="29" fill="#946012" font-weight="750" text-anchor="start">1.52 TB/s</text><text x="405" y="426" font-size="17" fill="#526980" font-weight="500" text-anchor="start">needed for 20 tok/s; generally keep in HBM</text><text x="36" y="504" font-size="18" fill="#526980" font-weight="500" text-anchor="start">Measure the actual endpoint: capacity, bandwidth, tail latency and write endurance.</text></g></svg>
