<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="title desc"><title id="title">累计芯片到货占比</title><desc id="desc">美国和中国的芯片数量与H100e算力占比；其他地区用差额计算。</desc><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><rect x="0.0" y="0.0" width="880.0" height="470.0" rx="16" fill="#f6f9fd"/><text x="32.0" y="43.0" font-size="17" fill="#1c5694" font-weight="700" text-anchor="start">LLMNEWS  /  02</text><text x="32.0" y="86.0" font-size="33" fill="#13233a" font-weight="700" text-anchor="start">芯片颗数与标称算力，不是同一张图</text><text x="32.0" y="121.0" font-size="21" fill="#536378" font-weight="400" text-anchor="start">2022 至 2026-06 累计到货占比；Epoch AI 2026-11-12 修订</text><text x="32.0" y="181.0" font-size="24" fill="#13233a" font-weight="700" text-anchor="start">AI 芯片数量</text><rect x="32.0" y="197.0" width="544.7" height="47.0" rx="0" fill="#1c5694"/><text x="304.4" y="227.0" font-size="23" fill="white" font-weight="700" text-anchor="middle">66.8%</text><rect x="576.7" y="197.0" width="148.5" height="47.0" rx="0" fill="#a3372f"/><text x="650.9" y="227.0" font-size="23" fill="white" font-weight="700" text-anchor="middle">18.2%</text><rect x="725.2" y="197.0" width="122.8" height="47.0" rx="0" fill="#14736c"/><text x="786.6" y="227.0" font-size="23" fill="white" font-weight="700" text-anchor="middle">15.1%</text><text x="32.0" y="293.0" font-size="24" fill="#13233a" font-weight="700" text-anchor="start">H100e 标称算力</text><rect x="32.0" y="309.0" width="587.2" height="47.0" rx="0" fill="#1c5694"/><text x="325.6" y="339.0" font-size="23" fill="white" font-weight="700" text-anchor="middle">72.0%</text><rect x="619.2" y="309.0" width="80.6" height="47.0" rx="0" fill="#a3372f"/><text x="659.5" y="339.0" font-size="23" fill="white" font-weight="700" text-anchor="middle">9.9%</text><rect x="699.8" y="309.0" width="148.2" height="47.0" rx="0" fill="#14736c"/><text x="773.9" y="339.0" font-size="23" fill="white" font-weight="700" text-anchor="middle">18.2%</text><text x="32.0" y="406.0" font-size="23" fill="#536378" font-weight="700" text-anchor="start">蓝：美国　红：中国　绿：其他地区</text><text x="32.0" y="444.0" font-size="19" fill="#536378" font-weight="400" text-anchor="start">四舍五入后或不等于 100%；标称算力不是实装在线或单次作业算力。</text></g></svg>
