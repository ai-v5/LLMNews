<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 577" role="img" aria-labelledby="title desc"><title id="title">真实科研任务的 API 成本和整项验收率</title><desc id="desc">ARE-bench样本，同任务、不同模型，非等预算；同一模型重试不保证独立。</desc><g font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif"><rect x="0.0" y="0.0" width="880.0" height="577.0" rx="16" fill="#f6f9fd"/><text x="32.0" y="43.0" font-size="17" fill="#1c5694" font-weight="700" text-anchor="start">LLMNEWS  /  05</text><text x="32.0" y="86.0" font-size="33" fill="#13233a" font-weight="700" text-anchor="start">低成本和高验收率是两条轴</text><text x="32.0" y="121.0" font-size="21" fill="#536378" font-weight="400" text-anchor="start">ARE-bench：75 个研究交付任务；横轴为单次 API 估算美元（对数）</text><line x1="105.0" y1="475.0" x2="752.0" y2="475.0" stroke="#c3d0e0" stroke-width="1" /><text x="87.0" y="481.0" font-size="20" fill="#536378" font-weight="400" text-anchor="end">20%</text><line x1="105.0" y1="421.0" x2="752.0" y2="421.0" stroke="#c3d0e0" stroke-width="1" /><text x="87.0" y="427.0" font-size="20" fill="#536378" font-weight="400" text-anchor="end">30%</text><line x1="105.0" y1="367.0" x2="752.0" y2="367.0" stroke="#c3d0e0" stroke-width="1" /><text x="87.0" y="373.0" font-size="20" fill="#536378" font-weight="400" text-anchor="end">40%</text><line x1="105.0" y1="313.0" x2="752.0" y2="313.0" stroke="#c3d0e0" stroke-width="1" /><text x="87.0" y="319.0" font-size="20" fill="#536378" font-weight="400" text-anchor="end">50%</text><line x1="105.0" y1="259.0" x2="752.0" y2="259.0" stroke="#c3d0e0" stroke-width="1" /><text x="87.0" y="265.0" font-size="20" fill="#536378" font-weight="400" text-anchor="end">60%</text><line x1="105.0" y1="205.0" x2="752.0" y2="205.0" stroke="#c3d0e0" stroke-width="1" /><text x="87.0" y="211.0" font-size="20" fill="#536378" font-weight="400" text-anchor="end">70%</text><line x1="105.0" y1="151.0" x2="752.0" y2="151.0" stroke="#c3d0e0" stroke-width="1" /><text x="87.0" y="157.0" font-size="20" fill="#536378" font-weight="4