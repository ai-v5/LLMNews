<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 960 514"><title id="t">Base capacity and modeled load</title><desc id="d">Planning numbers for DS-V4.1-Flash and Kimi K3.1 Pro. Three pools for each workload.</desc><rect x="0" y="0" width="960" height="514" rx="18" fill="#f7faff"/><g font-family="system-ui, sans-serif"><text x="34" y="54" font-size="36" font-weight="750" fill="#172b47" text-anchor="start">Agentic RL capacity plan</text><text x="34" y="88" font-size="20" font-weight="500" fill="#526780" text-anchor="start">GB300 NVL72  ·  two independent jobs  ·  estimates, not benchmarks</text><rect x="34" y="116" width="432" height="340" rx="14" fill="#ffffff"/><text x="56" y="160" font-size="26" font-weight="750" fill="#136d9d" text-anchor="start">DS-V4.1-Flash</text><text x="56" y="205" font-size="19" font-weight="650" fill="#172b47" text-anchor="start">Rollout</text><text x="444" y="205" font-size="19" font-weight="650" fill="#172b47" text-anchor="end">360 GPU</text><rect x="56" y="217" width="320" height="10" rx="5" fill="#dbe5ef"/><rect x="56" y="217" width="256.0" height="10" rx="5" fill="#136d9d"/><text x="444" y="230" font-size="16" font-weight="650" fill="#526780" text-anchor="end">80%</text><text x="56" y="270" font-size="19" font-weight="650" fill="#172b47" text-anchor="start">Sandbox</text><text x="444" y="270" font-size="19" font-weight="650" fill="#172b47" text-anchor="end">3,072 cores</text><rect x="56" y="282" width="320" height="10" rx="5" fill="#dbe5ef"/><rect x="56" y="282" width="196.8" height="10" rx="5" fill="#136d9d"/><text x="444" y="295" font-size="16" font-weight="650" fill="#526780" text-anchor="end">62%</text><text x="56" y="335" font-size="19" font-weight="650" fill="#172b47" text-anchor="start">Learner</text><text x="444" y="335" font-size="19" font-weight="650" fill="#172b47" text-anchor="end">72 GPU</text><rect x="56" y="347" width="320" height="10" rx="5" fill="#dbe5ef"/><rect x="56" y="347" width="248.5894752" height="10" rx="5" fill="#136d9d"/><text x="444" y="360" font-size="16" font-weight="650" fill="#526780" text-anchor="end">78%</text><text x="56" y="431" font-size="20" font-weight="750" fill="#136d9d" text-anchor="start">6,376 usable groups per hour</text><rect x="492" y="116" width="432" height="340" rx="14" fill="#ffffff"/><text x="514" y="160" font-size="26" font-weight="750" fill="#21745e" text-anchor="start">Kimi-K3.1-Pro</text><text x="514" y="205" font-size="19" font-weight="650" fill="#172b47" text-anchor="start">Rollout</text><text x="902" y="205" font-size="19" font-weight="650" fill="#172b47" text-anchor="end">864 GPU</text><rect x="514" y="217" width="320" height="10" rx="5" fill="#dbe5ef"/><rect x="514" y="217" width="256.0" height="10" rx="5" fill="#21745e"/><text x="902" y="230" font-size="16" font-weight="650" fill="#526780" text-anchor="end">80%</text><text x="514" y="270" font-size="19" font-weight="650" fill="#172b47" text-anchor="start">Sandbox</text><text x="902" y="270" font-size="19" font-weight="650" fill="#172b47" text-anchor="end">2,304 cores</text><rect x="514" y="282" width="320" height="10" rx="5" fill="#dbe5ef"/><rect x="514" y="282" width="192.0" height="10" rx="5" fill="#21745e"/><text x="902" y="295" font-size="16" font-weight="650" fill="#526780" text-anchor="end">60%</text><text x="514" y="335" font-size="19" font-weight="650" fill="#172b47" text-anchor="start">Learner</text><text x="902" y="335" font-size="19" font-weight="650" fill="#172b47" text-anchor="end">288 GPU</text><rect x="514" y="347" width="320" height="10" rx="5" fill="#dbe5ef"/><rect x="514" y="347" width="251.4959936" height="10" rx="5" fill="#21745e"/><text x="902" y="360" font-size="16" font-weight="650" fill="#526780" text-anchor="end">79%</text><text x="514" y="431" font-size="20" font-weight="750" fill="#21745e" text-anchor="start">4,666 usable groups per hour</text><text x="34" y="491" font-size="19" font-weight="500" fill="#526780" text-anchor="start">Bars show load vs each modeled pool capacity, not MFU or hardware utilization.</text></g></svg>
