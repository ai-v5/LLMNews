<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 553" role="img" aria-labelledby="t d"><title id="t">LLM storage hierarchy</title><desc id="d">HBM, host DRAM, local NVMe and shared storage have different roles. CMX shared KV is distinct from durable storage.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0l10 5L0 10z" fill="#526980"/></marker></defs><rect x="0" y="0" width="960" height="553" rx="12" fill="#f7faff" stroke="none"/><g font-family="system-ui, sans-serif"><text x="36" y="55" font-size="34" fill="#142a46" font-weight="750" text-anchor="start">Where SSD belongs in an LLM system</text><text x="36" y="89" font-size="21" fill="#526980" font-weight="500" text-anchor="start">Different paths, different service contracts</text><rect x="48" y="118" width="855" height="71" rx="12" fill="white" stroke="#cadbea"/><rect x="48" y="118" width="7" height="71" rx="2" fill="#146d9c" stroke="none"/><text x="69" y="149" font-size="23" fill="#146d9c" font-weight="750" text-anchor="start">GPU HBM</text><text x="334" y="145" font-size="19" fill="#142a46" font-weight="650" text-anchor="start">Active compute</text><text x="334" y="170" font-size="17" fill="#526980" font-weight="500" text-anchor="start">weights · live KV · activations</text><text x="879" y="159" font-size="16" fill="#146d9c" font-weight="650" text-anchor="end">Demand-driven</text><path d="M200 204 L200 191" fill="none" stroke="#526980" stroke-width="2.5"  marker-end="url(#a)"/><rect x="48" y="208" width="855" height="71" rx="12" fill="white" stroke="#cadbea"/><rect x="48" y="208" width="7" height="71" rx="2" fill="#25755f" stroke="none"/><text x="69" y="239" font-size="23" fill="#25755f" font-weight="750" text-anchor="start">Host DRAM</text><text x="334" y="235" font-size="19" fill="#142a46" font-weight="650" text-anchor="start">Warm cache / staging</text><text x="334" y="260" font-size="17" fill="#526980" font-weight="500" text-anchor="start">fast reuse · checkpoint snapshot</text><text x="879" y="249" font-size="16" fill="#25755f" font-weight="650" text-anchor="end">Overlapped</text><path d="M200 294 L200 281" fill="none" stroke="#526980" stroke-width="2.5"  marker-end="url(#a)"/><rect x="48" y="298" width="855" height="71" rx="12" fill="white" stroke="#cadbea"/><rect x="48" y="298" width="7" height="71" rx="2" fill="#25755f" stroke="none"/><text x="69" y="329" font-size="23" fill="#25755f" font-weight="750" text-anchor="start">Local NVMe</text><text x="334" y="325" font-size="19" fill="#142a46" font-weight="650" text-anchor="start">Node cache</text><text x="334" y="350" font-size="17" fill="#526980" font-weight="500" text-anchor="start">model shards · cold KV · staging</text><text x="879" y="339" font-size="16" fill="#25755f" font-weight="650" text-anchor="end">Rebuildable</text><path d="M200 384 L200 371" fill="none" stroke="#526980" stroke-width="2.5"  marker-end="url(#a)"/><rect x="48" y="388" width="855" height="71" rx="12" fill="white" stroke="#cadbea"/><rect x="48" y="388" width="7" height="71" rx="2" fill="#946012" stroke="none"/><text x="69" y="419" font-size="23" fill="#946012" font-weight="750" text-anchor="start">Shared flash / storage</text><text x="334" y="415" font-size="19" fill="#142a46" font-weight="650" text-anchor="start">Pod KV or durable tier</text><text x="334" y="440" font-size="17" fill="#526980" font-weight="500" text-anchor="start">CMX is KV; dataset/checkpoint durable</text><text x="879" y="429" font-size="16" fill="#946012" font-weight="650" text-anchor="end">Serviced over fabric</text><text x="48" y="499" font-size="17" fill="#526980" font-weight="500" text-anchor="start">GDS can bypass host data buffering; it does not bypass device or fabric limits.</text><text x="48" y="529" font-size="17" fill="#526980" font-weight="500" text-anchor="start">Keep active per-token working sets hot. Fetch cold bytes before the layer needs them.</text></g></svg>
